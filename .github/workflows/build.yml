name: Build

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "proto/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0  # no moving major tags upstream
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # --locked fails when uv.lock is out of date with pyproject.toml.
        run: uv sync --locked

      - name: Check generated protobuf code is current
        run: |
          uv run python -m grpc_tools.protoc -Iproto --python_out=src --pyi_out=src proto/aetioecg/v1/ecg.proto
          git diff --exit-code src/aetioecg/v1

      - name: Check formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest

      - name: CLI smoke test
        # A real `get` needs PTB-XL (network or a local copy), so only the command table is checked.
        run: uv run aetioecg --help

      - name: Build
        run: uv build
